name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend — tests & migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Verify Alembic migrations apply
        env:
          SERVICEFLOW_DATABASE_URL: sqlite:///./ci_migrations.db
        run: |
          alembic upgrade head
          alembic downgrade base

  frontend:
    name: Frontend — syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check JS modules
        run: |
          for f in $(find frontend/assets/js -name '*.js'); do
            node --check "$f"
          done
