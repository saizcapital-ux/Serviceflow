<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
  <title>Set a new password · Serviceflow</title>
  <link rel="stylesheet" href="/assets/css/design-system.css" />
  <script src="/config.js"></script>
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 20px;
      background: linear-gradient(135deg, var(--brand-900), var(--brand-700)); }
    .auth { width: 100%; max-width: 420px; background: #fff; border-radius: var(--r-xl);
      padding: 40px 36px; box-shadow: var(--sh-lg); }
    .auth .logo { width: 46px; height: 46px; border-radius: 12px;
      background: linear-gradient(135deg, var(--brand-400), var(--accent-500));
      display: grid; place-items: center; font-weight: 800; font-size: 1.4rem; color: #fff; margin-bottom: 20px; }
    .err { color: var(--danger); font-size: .88rem; margin-top: 10px; min-height: 1.2em; }
    .hint { font-size: .78rem; color: var(--ink-500); }
    .back { display:inline-block; margin-top: 18px; font-size: .85rem; color: var(--brand-600); }
  </style>
</head>
<body>
  <div class="auth">
    <div class="logo">S</div>
    <h2>Set a new password</h2>
    <div id="invalid" class="hide">
      <p class="err" style="min-height:auto">This reset link is invalid or has expired.</p>
      <a class="back" href="/forgot-password.html">Request a new link →</a>
    </div>
    <form id="form" class="stack hide" style="margin-top:14px">
      <label class="field"><span>New password</span>
        <input type="password" id="password" required autocomplete="new-password" minlength="8" placeholder="••••••••" />
        <small class="hint">At least 8 characters.</small></label>
      <label class="field"><span>Confirm password</span>
        <input type="password" id="confirm" required autocomplete="new-password" placeholder="••••••••" /></label>
      <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Update password</button>
      <div class="err" id="err"></div>
    </form>
    <a class="back" href="/login.html">← Back to sign in</a>
  </div>

  <script type="module">
    import { api, auth } from "/assets/js/api.js";
    const params = new URLSearchParams(location.search);
    const token = params.get("token");
    const form = document.getElementById("form");
    const err = document.getElementById("err");
    const btn = document.getElementById("submitBtn");

    if (!token) {
      document.getElementById("invalid").classList.remove("hide");
    } else {
      form.classList.remove("hide");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      const pw = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      if (pw.length < 8) { err.textContent = "Password must be at least 8 characters."; return; }
      if (pw !== confirm) { err.textContent = "Passwords don't match."; return; }
      btn.disabled = true; btn.textContent = "Updating…";
      try {
        const res = await api.resetPassword(token, pw);
        auth.save(res.access_token, res.user);
        location.href = res.user.role === "customer" ? "/portal/" : "/app/";
      } catch (ex) {
        err.textContent = ex.message || "Could not reset password.";
        btn.disabled = false; btn.textContent = "Update password";
      }
    });
  </script>
</body>
</html>
