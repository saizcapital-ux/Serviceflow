<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
  <title>Page not found · Serviceflow</title>
  <link rel="stylesheet" href="/assets/css/design-system.css" />
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 24px; text-align: center;
      background: linear-gradient(180deg, #fff, var(--surface-2)); }
    .wrap { max-width: 440px; }
    .logo { width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 20px; color:#fff;
      font-weight: 800; font-size: 1.5rem; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--brand-500), var(--accent-500)); }
    .code { font-size: 4rem; font-weight: 800; letter-spacing: -.04em; color: var(--brand-600); line-height: 1; }
    h1 { font-size: 1.4rem; margin: 8px 0 6px; }
    p { color: var(--ink-600); }
    .row { justify-content: center; margin-top: 22px; gap: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">S</div>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or may have moved.</p>
    <div class="row row">
      <a class="btn btn-primary" href="/">Go home</a>
      <a class="btn btn-ghost" href="/login.html">Sign in</a>
    </div>
  </div>
</body>
</html>
