<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0b1f33" />
  <link rel="apple-touch-icon" href="/assets/img/icon-192.png" />
  <title>Serviceflow · Staff</title>
  <script>(function(){try{var t=localStorage.getItem('sf_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="/assets/css/design-system.css" />
  <script src="/config.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="logo">S</div><b>Serviceflow</b></div>
      <a class="nav-link" data-route="dashboard"><span class="ic">▦</span> Dashboard</a>
      <a class="nav-link" data-route="analytics"><span class="ic">📈</span> Analytics</a>
      <a class="nav-link" data-route="workorders"><span class="ic">🔧</span> Work Orders</a>
      <a class="nav-link" data-route="field"><span class="ic">📍</span> Field Service</a>
      <a class="nav-link" data-route="customers"><span class="ic">🏢</span> Customers</a>
      <a class="nav-link" data-route="equipment"><span class="ic">⚙️</span> Equipment</a>
      <a class="nav-link" data-route="maintenance"><span class="ic">🗓️</span> Maintenance</a>
      <a class="nav-link" data-route="inventory"><span class="ic">📦</span> Inventory</a>
      <a class="nav-link" data-route="invoices"><span class="ic">🧾</span> Invoices</a>
      <a class="nav-link" data-route="notifications"><span class="ic">🔔</span> Notifications</a>
      <a class="nav-link" data-route="team" id="navTeam"><span class="ic">👥</span> Team</a>
      <a class="nav-link" data-route="templates" id="navTemplates"><span class="ic">📐</span> Templates</a>
      <a class="nav-link" data-route="audit" id="navAudit"><span class="ic">📜</span> Audit log</a>
      <a class="nav-link" data-route="developer" id="navDev"><span class="ic">🔌</span> Developers</a>
      <a class="nav-link" data-route="billing"><span class="ic">💳</span> Billing</a>
      <div class="spacer"></div>
      <div class="who">
        <b id="whoName">—</b>
        <span id="whoRole" class="muted"></span>
        <div style="margin-top:10px"><a class="nav-link" data-route="help" style="padding:.4rem .5rem">❔ Help &amp; guide</a></div>
        <div><a class="nav-link" data-route="account" style="padding:.4rem .5rem">⚙ Account settings</a></div>
        <div><a id="themeToggle" class="nav-link" style="padding:.4rem .5rem">🌙 Dark mode</a></div>
        <div><a id="logout" class="nav-link" style="padding:.4rem .5rem">↩ Sign out</a></div>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div class="row">
          <strong id="orgName">Service Center</strong>
          <select id="locSwitcher" class="hide" style="max-width:220px;padding:.4rem .6rem"></select>
        </div>
        <div style="position:relative;flex:1;max-width:420px;margin:0 16px">
          <input id="globalSearch" type="search" placeholder="🔍 Search work orders, customers, equipment…"
                 autocomplete="off" style="padding:.5rem .7rem" />
          <div id="searchResults" class="card hide" style="position:absolute;top:110%;left:0;right:0;z-index:40;max-height:60vh;overflow:auto;box-shadow:var(--sh-lg)"></div>
        </div>
        <div class="row">
          <button class="btn btn-primary btn-sm" id="newWoBtn">+ New Work Order</button>
        </div>
      </div>
      <div class="content" id="view"><div class="empty"><div class="big">◍</div>Loading…</div></div>
    </div>
  </div>
  <script type="module" src="/assets/js/staff.js"></script>
  <script src="/assets/js/pwa.js"></script>
</body>
</html>
