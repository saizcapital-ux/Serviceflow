<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
  <title>Forgot password · Serviceflow</title>
  <link rel="stylesheet" href="/assets/css/design-system.css" />
  <script src="/config.js"></script>
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 20px;
      background: linear-gradient(135deg, var(--brand-900), var(--brand-700)); }
    .auth { width: 100%; max-width: 420px; background: #fff; border-radius: var(--r-xl);
      padding: 40px 36px; box-shadow: var(--sh-lg); }
    .auth .logo { width: 46px; height: 46px; border-radius: 12px;
      background: linear-gradient(135deg, var(--brand-400), var(--accent-500));
      display: grid; place-items: center; font-weight: 800; font-size: 1.4rem; color: #fff; margin-bottom: 20px; }
    .err { color: var(--danger); font-size: .88rem; margin-top: 10px; min-height: 1.2em; }
    .ok { color: var(--ok); font-size: .9rem; margin-top: 12px; }
    .back { display:inline-block; margin-top: 18px; font-size: .85rem; color: var(--brand-600); }
  </style>
</head>
<body>
  <div class="auth">
    <div class="logo">S</div>
    <h2>Reset your password</h2>
    <p class="muted" style="font-size:.9rem">Enter your account email and we'll send you a link to set a new password.</p>
    <form id="form" class="stack" style="margin-top:14px">
      <label class="field"><span>Email</span>
        <input type="email" id="email" required autocomplete="username" placeholder="you@company.com" /></label>
      <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Send reset link</button>
      <div class="err" id="err"></div>
    </form>
    <div id="sent" class="ok hide"></div>
    <a class="back" href="/login.html">← Back to sign in</a>
  </div>

  <script type="module">
    import { api } from "/assets/js/api.js";
    const form = document.getElementById("form");
    const err = document.getElementById("err");
    const btn = document.getElementById("submitBtn");
    const sent = document.getElementById("sent");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = ""; btn.disabled = true; btn.textContent = "Sending…";
      try {
        await api.forgotPassword(document.getElementById("email").value.trim());
        form.classList.add("hide");
        sent.classList.remove("hide");
        sent.textContent = "If that email is registered, a reset link is on its way. Check your inbox.";
      } catch (ex) {
        err.textContent = ex.message || "Something went wrong.";
        btn.disabled = false; btn.textContent = "Send reset link";
      }
    });
  </script>
</body>
</html>
