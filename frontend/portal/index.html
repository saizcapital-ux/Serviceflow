<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0b1f33" />
  <link rel="apple-touch-icon" href="/assets/img/icon-192.png" />
  <title>Serviceflow · Customer Portal</title>
  <link rel="stylesheet" href="/assets/css/design-system.css" />

<body>
  <div class="shell">
    <aside class="sidebar">

    <div class="main">
      <div class="topbar">
        <strong>Repair status &amp; history</strong>
        <span class="badge">Secure customer access</span>

      <div class="content" id="view"><div class="empty"><div class="big">◍</div>Loading…</div></div>
